name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    runs-on: [self-hosted, linux, moonbox]
    steps:
      - uses: actions/checkout@v4

      - name: Byte-compile poller sources (syntax/import sanity check)
        run: python3.11 -m compileall -q app/poller
